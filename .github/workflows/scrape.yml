name: Scrape Trading Signals

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scrape
        run: |
          curl -X POST "${{ secrets.NEXT_PUBLIC_URL }}/api/scrape" \
            -H "Authorization: Bearer ${{ secrets.SCRAPE_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"sources":["telegram","tradingview","forexfactory","youtube"]}' \
            --max-time 55
